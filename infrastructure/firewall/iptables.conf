# Generated by iptables-save v1.8.7 on Fri Sep 18 07:00:00 2026
# Firewall Rules: IoT Gateway Pusat - Lab Elektro Unsri x PLN Bali UID
*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT ACCEPT [0:0]

# Izinkan Loopback lokal
-A INPUT -i lo -j ACCEPT

# Izinkan Established & Related Connection
-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

# Izinkan ICMP Ping untuk Monitoring Jaringan
-A INPUT -p icmp --icmp-type 8 -m limit --limit 5/sec -j ACCEPT

# Izinkan WireGuard VPN Tunnel Lab Unsri
-A INPUT -p udp --dport 51820 -m comment --comment "WireGuard VPN Lab Unsri" -j ACCEPT

# Izinkan MQTT TLS Port 8883 (Node Sensor ESP32 Cluster)
-A INPUT -p tcp --dport 8883 -s 10.24.0.0/16 -m comment --comment "MQTT TLS Telemetry Nodes" -j ACCEPT

# Izinkan Web NOC & HTTPS (Port 80 & 443)
-A INPUT -p tcp --dport 80 -j ACCEPT
-A INPUT -p tcp --dport 443 -j ACCEPT

# Drop and Log scan / brute force port
-A INPUT -m limit --limit 3/min -j LOG --log-prefix "FIREWALL-DROP: " --log-level 4
COMMIT
# Completed on Fri Sep 18 07:00:00 2026

